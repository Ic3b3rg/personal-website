# Loaded from nginx.conf's http context via /etc/nginx/conf.d/*.conf.
# Security headers apply only to the two public landing documents so the
# noindex prototype routes can retain their existing inline scripts.
map "$host:$uri" $personal_website_document_enabled {
    default 0;
    ~^(?:www\.)?silvioceccarini\.dev:/(?:it/)?(?:index\.html)?$ 1;
}

map $personal_website_document_enabled $personal_website_csp {
    default "";
    1 "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; media-src 'none'; object-src 'none'; script-src 'self'; style-src 'self'; upgrade-insecure-requests; require-trusted-types-for 'script'";
}

map $personal_website_document_enabled $personal_website_hsts {
    default "";
    1 "max-age=31536000";
}

map $personal_website_document_enabled $personal_website_coop {
    default "";
    1 "same-origin";
}

map $personal_website_document_enabled $personal_website_xfo {
    default "";
    1 "DENY";
}

map $personal_website_document_enabled $personal_website_nosniff {
    default "";
    1 "nosniff";
}

map $personal_website_document_enabled $personal_website_referrer_policy {
    default "";
    1 "strict-origin-when-cross-origin";
}

map $personal_website_document_enabled $personal_website_permissions_policy {
    default "";
    1 "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=(), usb=()";
}

map "$host:$uri" $personal_website_cache_control {
    default "";
    ~^(?:www\.)?silvioceccarini\.dev:/(?:it/)?(?:index\.html)?$ "public, max-age=0, must-revalidate, no-transform";
    ~^(?:www\.)?silvioceccarini\.dev:/prototype/ "public, max-age=0, must-revalidate, no-transform";
    ~^(?:www\.)?silvioceccarini\.dev:/_astro/ "public, max-age=31536000, immutable";
    ~^(?:www\.)?silvioceccarini\.dev:/fonts/[^/]+\.woff2$ "public, max-age=31536000, immutable";
    ~^(?:www\.)?silvioceccarini\.dev:/silvio-avatar\.[0-9a-f]+\.png$ "public, max-age=31536000, immutable";
}

add_header Content-Security-Policy $personal_website_csp always;
add_header Strict-Transport-Security $personal_website_hsts always;
add_header Cross-Origin-Opener-Policy $personal_website_coop always;
add_header X-Frame-Options $personal_website_xfo always;
add_header X-Content-Type-Options $personal_website_nosniff always;
add_header Referrer-Policy $personal_website_referrer_policy always;
add_header Permissions-Policy $personal_website_permissions_policy always;
add_header Cache-Control $personal_website_cache_control always;
