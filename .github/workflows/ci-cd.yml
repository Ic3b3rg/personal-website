name: Build & Deploy Astro Portfolio

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/key"
          ssh-keyscan -H "$SSH_HOST" > "$RUNNER_TEMP/deploy-ssh/known_hosts"

      - name: Deploy and reload nginx
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          tar -C dist -czf - . | ssh \
            -i "$RUNNER_TEMP/deploy-ssh/key" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            'tar -xzf - -C /var/www/personal-website/dist && sudo systemctl reload nginx'

      - name: Remove temporary SSH files
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-ssh"
